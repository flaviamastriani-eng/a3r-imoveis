<body data-pagina="inicio">
  <div class="faixa" id="faixa"></div>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="index.html"><img src="imagens/logo-nova/logo-horizontal.svg" alt="A3R Imóveis"></a>
      <nav class="menu" aria-label="Menu principal">

    <section class="abertura">

      <div class="conteudo abertura-in">

        <p id="hero-texto" class="abertura-texto"></p>

      </div>
    </section>

    <section class="secao">
      <div class="conteudo">

        <h2 class="titulo-secao" id="quem-somos-titulo">&nbsp;</h2>

  <footer class="rodape" id="rodape"></footer>
  <a class="whats-flutuante" id="whats-flutuante" href="#" target="_blank" rel="noopener" aria-label="Fale no WhatsApp"></a>
